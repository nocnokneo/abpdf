name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Installs the tools that mise.toml pins, PDFium among them.
      - uses: jdx/mise-action@v5
      - run: mise run check

  corpus:
    name: test corpus is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run corpus
      # The PDFs that are checked in have to be what their sources build to.
      - run: git diff --exit-code -- tests/corpus

[package]
name = "abpdf"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Compare two PDFs and get a side-by-side redline PDF"
repository = "https://github.com/nocnokneo/abpdf"

[dependencies]
krilla = { version = "0.8.2", default-features = false, features = ["pdf", "simple-text"] }
# The feature names the PDFium release whose API is bound.
# mise.toml installs that release.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125"] }
thiserror = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"

[dev-dependencies]
pdf-writer = "0.15"

[settings]
lockfile = true

[tools]
# rustfmt and clippy are named because not every rustup profile has them.
# rust-src is what rust-analyzer reads the standard library from.
rust = { version = "1.99.1", components = "rustfmt,clippy,rust-src" }
typst = "0.15.1"

[env]
# The fonts built into Typst are the same everywhere; installed ones are not.
TYPST_IGNORE_SYSTEM_FONTS = "true"

[tasks.check]
description = "Everything that CI checks"
env = { RUSTDOCFLAGS = "--deny warnings" }
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- --deny warnings",
  "cargo doc --no-deps",
  "cargo test",
]

[tasks.corpus]
description = "Rebuild the test PDFs that are checked in from their Typst sources"
run = [
  "typst compile tests/corpus/reading.typ tests/corpus/reading-tagged.pdf",
  "typst compile --no-pdf-tags tests/corpus/reading.typ tests/corpus/reading-untagged.pdf",
  "typst compile --input revision=old tests/corpus/revisions.typ tests/corpus/revisions-old-tagged.pdf",
  "typst compile --input revision=new tests/corpus/revisions.typ tests/corpus/revisions-new-tagged.pdf",
  "typst compile --no-pdf-tags --input revision=old tests/corpus/revisions.typ tests/corpus/revisions-old-untagged.pdf",
  "typst compile --no-pdf-tags --input revision=new tests/corpus/revisions.typ tests/corpus/revisions-new-untagged.pdf",
  # The drawings come first: figures.typ includes them.
  "typst compile --input revision=old tests/corpus/drawing.typ tests/corpus/drawing-old.pdf",
  "typst compile --input revision=new tests/corpus/drawing.typ tests/corpus/drawing-new.pdf",
  "typst compile --input revision=old tests/corpus/figures.typ tests/corpus/figures-old-tagged.pdf",
  "typst compile --input revision=new tests/corpus/figures.typ tests/corpus/figures-new-tagged.pdf",
  "typst compile --no-pdf-tags --input revision=old tests/corpus/figures.typ tests/corpus/figures-old-untagged.pdf",
  "typst compile --no-pdf-tags --input revision=new tests/corpus/figures.typ tests/corpus/figures-new-untagged.pdf",
]

[tasks.manual]
description = "Build both revisions of the synthetic manual, a few hundred pages each, into target/corpus"
run = [
  "typst compile --input revision=old tests/corpus/manual.typ target/corpus/manual-old.pdf",
  "typst compile --input revision=new tests/corpus/manual.typ target/corpus/manual-new.pdf",
]
